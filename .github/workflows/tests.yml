name: tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt -r audit/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium chrome
      - run: python -m pytest -vv
        env:
          QT_QPA_PLATFORM: offscreen
